<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex - Games</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#121212;color:white;overflow-x:hidden;}

#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}

.sidebar{position:fixed;left:0;top:0;height:100%;width:220px;background:#0f0f0f;display:flex;flex-direction:column;padding:16px 12px;gap:10px;box-shadow:5px 0 15px rgba(0,0,0,0.6);transition:width .2s;z-index:20;}
.sidebar.collapsed{width:70px;}
.sidebar button{height:44px;border-radius:10px;border:none;background:#1f1f1f;color:white;cursor:pointer;font-size:14px;transition:.2s;padding:0 12px;text-align:left;width:100%;}
.sidebar button:hover{background:#5865f2;transform:translateY(-1px);}
.sidebar .toggle-btn{text-align:center;font-weight:600;background:#243b55;}
.sidebar.collapsed button{font-size:0;padding:0;display:flex;justify-content:center;align-items:center;}
.sidebar.collapsed button::after{font-size:12px;}
.sidebar.collapsed .toggle-btn::after{content:'>>';font-size:14px;}
.sidebar.collapsed .home-btn::after{content:'Home';}
.sidebar.collapsed .games-btn::after{content:'Games';}
.sidebar.collapsed .arcade-btn::after{content:'Arcade';}
.sidebar.collapsed .minecraft-btn::after{content:'MC';}
.sidebar.collapsed .tools-btn::after{content:'Tools';}

header,.home-screen,#gamesSection,.category{margin-left:220px;transition:margin-left .2s;}
body.sidebar-collapsed header,
body.sidebar-collapsed .home-screen,
body.sidebar-collapsed #gamesSection,
body.sidebar-collapsed .category{margin-left:70px;}

header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:linear-gradient(90deg,#141e30,#243b55);box-shadow:0 5px 20px rgba(0,0,0,0.5);position:sticky;top:0;z-index:10;}
header h1{font-weight:600;letter-spacing:2px;cursor:pointer;}
#searchBar{padding:10px 15px;border-radius:30px;border:none;width:220px;background:#1f1f1f;color:white;outline:none;transition:.2s;}
#searchBar:focus{background:#2a2a2a;width:260px;}

.home-screen{padding:36px 40px;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:900px;}
.stat-card{background:#1c1c1c;border-radius:14px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.4);}
.stat-card h2{font-size:16px;opacity:.7;margin-bottom:10px;}
.stat-card p{font-size:24px;font-weight:600;}

#gamesSection{display:none;}
.card-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;padding:40px;max-width:1200px;}
.card{background:#1c1c1c;border-radius:15px;padding:15px;text-align:center;transition:.25s;box-shadow:0 5px 15px rgba(0,0,0,0.4);position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;width:200%;height:200%;background:linear-gradient(45deg,transparent,#00c6ff,transparent);top:-50%;left:-50%;animation:spin 6s linear infinite;opacity:.2;pointer-events:none;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.card:hover{transform:translateY(-10px) scale(1.05);box-shadow:0 20px 45px rgba(0,0,0,0.7);}
.card img{width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:10px;}
.card h2{font-size:18px;margin-bottom:10px;}
.card button{padding:10px 20px;border:none;border-radius:30px;background:linear-gradient(45deg,#007bff,#00c6ff);color:white;font-size:15px;cursor:pointer;transition:.2s;}
.card button:hover{transform:scale(1.1);}

.iframe-container{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;flex-direction:column;z-index:99999;}
.iframe-container.active{display:flex;}
.iframe-container iframe{width:90%;height:85%;border:none;border-radius:10px;box-shadow:0 10px 40px black;}
.controls{position:absolute;top:15px;right:20px;display:flex;gap:10px;}
.controls button{padding:10px 15px;border:none;border-radius:8px;font-size:14px;cursor:pointer;}
.close-button{background:#ff3b3b;color:white;}
.fullscreen-button{background:#2ecc71;color:white;}
.open-tab-button{background:#5865f2;color:white;display:none;}
.open-tab-button.show{display:inline-block;}
.iframe-status{margin-top:12px;font-size:14px;opacity:.9;text-align:center;max-width:90%;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#444;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:#666;}
</style>
</head>

<body>
<canvas id="particles"></canvas>

<div class="sidebar" id="sidebar">
<button class="toggle-btn" onclick="toggleSidebar()">Collapse Sidebar</button>
<button class="home-btn" onclick="showHome()">Home</button>
<button class="games-btn" onclick="showGames('all')">All Games</button>
<button class="arcade-btn" onclick="showGames('arcade')">Arcade Games</button>
<button class="minecraft-btn" onclick="showGames('minecraft')">Minecraft</button>
<button class="tools-btn" onclick="showGames('tools')">Proxy Tools</button>
</div>

<header>
<h1 onclick="showHome()">Codex</h1>
<input type="text" id="searchBar" placeholder="Search games...">
</header>

<section class="home-screen" id="homeScreen">
<div class="home-grid">
<div class="stat-card">
<h2>Exact Time</h2>
<p id="exactTime">--:--:--.---</p>
</div>
<div class="stat-card">
<h2>FPS</h2>
<p id="fpsCount">0</p>
</div>
<div class="stat-card">
<h2>Status</h2>
<p>Welcome to Codex Hub</p>
</div>
</div>
</section>

<section id="gamesSection">
<div class="card-container" id="cardContainer">
<div class="card" data-category="arcade" data-title="sand smoke"><img src="https://dummyimage.com/300x200/444/fff&text=SandSmoke"><h2>SandSmoke 3XP</h2><button onclick="playGame('https://sand-smoke-proxy.vercel.app/sand/')">Play</button></div>
<div class="card" data-category="arcade" data-title="truffled"><img src="https://dummyimage.com/300x200/444/fff&text=Truffled"><h2>Truffled.lol</h2><button onclick="playGame('https://truffled.lol/')">Play</button></div>
<div class="card" data-category="tools" data-title="fern"><img src="https://dummyimage.com/300x200/444/fff&text=FernIsBest"><h2>FernIsBest</h2><button onclick="playGame('https://s3.amazonaws.com/fernisbest/')">Play</button></div>
<div class="card" data-category="arcade" data-title="froggies arcade"><img src="https://dummyimage.com/300x200/444/fff&text=Froggiesarcade.win"><h2>Froggie's Arcade</h2><button onclick="playGame('https://frogiesarcade.win/')">Play</button></div>
<div class="card" data-category="minecraft" data-title="minecraft"><img src="https://dummyimage.com/300x200/444/fff&text=Minecraft"><h2>Minecraft Web Edition</h2><button onclick="playGame('https://mcraft.fun')">Play</button></div>
<div class="card" data-category="tools" data-title="mangomath"><img src="https://dummyimage.com/300x200/444/fff&text=2xM"><h2>MangoMath</h2><button onclick="playGame('https://2xm-yk-who-it-is_bs.oneapp.dev/')">Play</button></div>
</div>
</section>

<div class="iframe-container" id="iframeContainer">
<div class="controls">
<button class="open-tab-button" id="openTabButton" onclick="openInNewTab()">Open in New Tab</button>
<button class="fullscreen-button" onclick="fullscreenGame()">Fullscreen</button>
<button class="close-button" onclick="closeGame()">Close</button>
</div>
<iframe id="gameIframe" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
<p class="iframe-status" id="iframeStatus"></p>
</div>

<script>
const sidebar=document.getElementById('sidebar')
const searchBar=document.getElementById('searchBar')
let currentCategory='all'
let activeGameUrl=''
let frameCheckTimer

function toggleSidebar(){
sidebar.classList.toggle('collapsed')
document.body.classList.toggle('sidebar-collapsed')
const collapsed=sidebar.classList.contains('collapsed')
document.querySelector('.toggle-btn').textContent=collapsed?'Expand Sidebar':'Collapse Sidebar'
}

function showHome(){
document.getElementById('homeScreen').style.display='block'
document.getElementById('gamesSection').style.display='none'
searchBar.value=''
}

function showGames(category='all'){
document.getElementById('homeScreen').style.display='none'
document.getElementById('gamesSection').style.display='block'
currentCategory=category
filterCards()
}

function filterCards(){
const searchQuery=searchBar.value.toLowerCase()
const cards=document.querySelectorAll('.card')
cards.forEach(card=>{
const matchesSearch=card.getAttribute('data-title').toLowerCase().includes(searchQuery)
const matchesCategory=currentCategory==='all'||card.dataset.category===currentCategory
card.style.display=matchesSearch&&matchesCategory?'block':'none'
})
}

searchBar.addEventListener('input',filterCards)

function playGame(url){
activeGameUrl=url
const iframe=document.getElementById('gameIframe')
const container=document.getElementById('iframeContainer')
const status=document.getElementById('iframeStatus')
const openTabButton=document.getElementById('openTabButton')
status.textContent='Loading game...'
openTabButton.classList.remove('show')
container.classList.add('active')
iframe.src=url
clearTimeout(frameCheckTimer)
frameCheckTimer=setTimeout(()=>{
if(iframe.src&&iframe.contentWindow&&iframe.contentWindow.location.href==='about:blank'){
status.textContent='This site blocks iframe embedding. Use Open in New Tab.'
openTabButton.classList.add('show')
}else{status.textContent=''}
},1800)
}

function closeGame(){
const iframe=document.getElementById('gameIframe')
const container=document.getElementById('iframeContainer')
const status=document.getElementById('iframeStatus')
const openTabButton=document.getElementById('openTabButton')
clearTimeout(frameCheckTimer)
iframe.src=''
container.classList.remove('active')
status.textContent=''
openTabButton.classList.remove('show')
}

function openInNewTab(){if(activeGameUrl){window.open(activeGameUrl,'_blank','noopener,noreferrer')}}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeGame()}})

function fullscreenGame(){
const container=document.getElementById('iframeContainer')
if(container.requestFullscreen){container.requestFullscreen()}
else if(container.webkitRequestFullscreen){container.webkitRequestFullscreen()}
else if(container.msRequestFullscreen){container.msRequestFullscreen()}
}

function updateExactTime(){
const now=new Date()
document.getElementById('exactTime').textContent=now.toLocaleTimeString('en-US',{hour12:false})+'.'+String(now.getMilliseconds()).padStart(3,'0')
}
setInterval(updateExactTime,100)
updateExactTime()

let lastFpsTime=performance.now(),frames=0
function trackFps(ts){
frames++
if(ts-lastFpsTime>=1000){
document.getElementById('fpsCount').textContent=Math.round((frames*1000)/(ts-lastFpsTime))
frames=0
lastFpsTime=ts
}
requestAnimationFrame(trackFps)
}
requestAnimationFrame(trackFps)

const canvas=document.getElementById('particles')
const ctx=canvas.getContext('2d')
canvas.width=window.innerWidth
canvas.height=window.innerHeight
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight})
let particles=[]
for(let i=0;i<80;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5})}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();p.x+=p.dx;p.y+=p.dy});requestAnimationFrame(animate)}
animate()

function cloak(){
document.title='Google Classroom'
const link=document.querySelector("link[rel='icon']")||document.createElement('link')
link.rel='icon'
link.href='https://ssl.gstatic.com/classroom/favicon.png'
document.head.appendChild(link)
}
cloak()
</script>
</body>
</html>
